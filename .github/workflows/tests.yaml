name: Tests

on:
  push:
    branches: [trunk, action-test]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      cache:
        description: outrun's verdict namespace (ARK-81 bench; a fresh one is a cold verdict cache)
        type: string
        default: outrun

permissions:
  contents: read # For actions/checkout.
  pull-requests: read # For dorny/paths-filter to read pull requests.
  id-token: write # outrun's cache (ARK-81)

env:
  OUTRUN_CACHE_URL: https://turbo-cache.arkadia.so
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}

# Cancel previous workflows on the PR when there are multiple fast commits.
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name:
      Testing ${{ matrix.config.name != 'Default' && format('({0})',
      matrix.config.name) || '' }} (${{ matrix.runner }})
    strategy:
      matrix:
        # Test a recent version of each supported OS, covering both x86-64 and
        # AArch64: Linux on x86-64 and AArch64, and macOS on AArch64.
        runner: ['ubuntu-22.04-arm', 'macos-26']
        # Create a synthetic matrix dimension with the event name for filtering.
        event: ['${{ github.event_name }}']
        config:
          - name: 'Default'
            flags: ''
          - name: 'Opt'
            flags: '-c opt'
        # ARK-81 engine bench: ASan left out (its job loses its runner mid-build on outrun, ARK-25).
    # ARK-81 bench: the matrix keeps upstream's runner names (the setup actions branch on them), mapped to outrun's labels.
    runs-on: ${{ matrix.runner == 'macos-26' && 'outrun-macos' || 'outrun-linux-arm64' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # When adding endpoints, see README.md.
          # prettier-ignore
          allowed-endpoints: >
            *.blob.storage.azure.net:443
            *.githubapp.com:443
            *.sourceforge.net:443
            api.github.com:443
            api.ipify.org:443
            bcr.bazel.build:443
            download.gnome.org:443
            downloads.sourceforge.net:443
            files.pythonhosted.org:443
            formulae.brew.sh:443
            github.com:443
            go.dev:443
            mirror.bazel.build:443
            mirrors.kernel.org:443
            nodejs.org:443
            oauth2.googleapis.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            releases.bazel.build:443
            storage.googleapis.com:443
            uploads.github.com:443
            www.googleapis.com:443
            turbo-cache.arkadia.so:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # outrun engine (ARK-81): the whole cell is one command unit of outrun.json, replayed when its
      # inputs, toolchain and machine are unchanged; on a miss Bazel runs with outrun's cache as its
      # remote cache (`outrun bazel-cache`), as upstream runs with its GCS bucket.
      - name: 'outrun: start'
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: 'outrun: Bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: 'outrun: look the cell up'
        id: look
        run: .github/outrun/run lookup "test:${{ matrix.runner }}-${{ matrix.config.name }}"
      - name: 'outrun: Bazel remote cache'
        if: steps.look.outputs.run == 'true'
        shell: bash
        # One namespace for Bazel's entries across rounds, as upstream's bucket outlives runs; the
        # verdicts use the round's own namespace (OUTRUN_CACHE_TEAM).
        env:
          OUTRUN_CACHE_TEAM: carbon-bazel2
        run: |
          nohup .github/outrun/run bazel-cache --port 7071 > "$RUNNER_TEMP/bazel-cache.log" 2>&1 &
          for _ in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:7071/ && break; sleep 0.2; done
          cat "$RUNNER_TEMP/bazel-cache.log"

      # ARK-81 bench: outrun's images have no bazelisk (GitHub's runner images do).
      - name: 'outrun: install bazelisk'
        if: steps.look.outputs.run == 'true'
        shell: bash
        run: |
          if ! command -v bazelisk >/dev/null; then
            os=$(uname -s | tr A-Z a-z); arch=$(uname -m); [ "$arch" = aarch64 ] && arch=arm64; [ "$arch" = x86_64 ] && arch=amd64
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$HOME/.local/bin/bazelisk" "https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-$os-$arch"
            chmod +x "$HOME/.local/bin/bazelisk"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # ARK-81 bench, layer 1 only: Bazel's disk and repository caches kept between runs with actions/cache,
      # instead of upstream's remote cache (a GCS bucket whose write key a fork does not have).
      - name: 'outrun: Bazel repository cache'
        if: steps.look.outputs.run == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ matrix.runner }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ matrix.runner }}-

      - id: test-setup
        if: steps.look.outputs.run == 'true'
        uses: ./.github/actions/test-setup
        with:
          matrix_runner: ${{ matrix.runner }}
          base_sha:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha }}
          remote_cache_key: ${{ secrets.CARBON_BUILDS_GITHUB }}
          targets_file: ${{ runner.temp }}/targets

      # Build and run just the tests impacted by the PR or merge group.
      - name: Test (${{ matrix.config.name }})
        if: steps.look.outputs.run == 'true' && steps.test-setup.outputs.has_code == 'true'
        shell: bash
        env:
          # 'libtool_check_unique failed to generate' workaround.
          # https://github.com/bazelbuild/bazel/issues/14113#issuecomment-999794586
          BAZEL_USE_CPP_ONLY_TOOLCHAIN: 1
          TARGETS_FILE: ${{ runner.temp }}/targets
        run: |
          # Decrease the jobs sharply if we see repeated failures to try to
          # work around transient network errors even if it makes things
          # slower. Note that we allow passing targets that are incompatible and
          # skip thim as-if we were using `//...` style wild card patterns.
          ./scripts/run_bazel.py \
            --attempts=5 --jobs-on-last-attempt=4 \
            test ${{ matrix.config.flags }} \
            --target_pattern_file=$TARGETS_FILE

      # See "Disk space before build" in `test-setup`.
      - name: Disk space after build
        if: steps.look.outputs.run == 'true' && steps.test-setup.outputs.has_code == 'true'
        run: df -h

      - name: 'outrun: Bazel cache log'
        if: always() && steps.look.outputs.run == 'true'
        run: tail -20 "$RUNNER_TEMP/bazel-cache.log" || true

      - name: 'outrun: record the cell'
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record "test:${{ matrix.runner }}-${{ matrix.config.name }}" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}
